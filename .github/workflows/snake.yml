name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: lokhnadhgembali
          outputs: |
            dist/github-contribution-grid-snake.svg?color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353&color_snake=#d000ff
            dist/github-contribution-grid-snake-dark.svg?color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353&color_snake=#d000ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update contribution snake"