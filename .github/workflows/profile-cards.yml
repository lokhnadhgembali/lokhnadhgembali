name: Generate GitHub Profile Cards

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: lokhnadhgembali
          cards: overview,contributions,languages
          output-dir: assets/profile
          themes: dark
          commit: true
          commit-message: "chore(profile): refresh GitHub analytics cards [skip ci]"
