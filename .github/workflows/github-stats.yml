name: Update GitHub Analytics

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=lokhnadhgembali&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=8B5CF6&icon_color=7C3AED&text_color=C9D1D9
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=lokhnadhgembali&layout=compact&langs_count=6&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=8B5CF6&text_color=C9D1D9
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace external analytics with local cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text()
          s = s.replace("https://github-readme-stats-sigma-five.vercel.app/api?username=lokhnadhgembali&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=8B5CF6&icon_color=7C3AED&text_color=C9D1D9", "./profile/stats.svg")
          s = s.replace("https://github-readme-stats-sigma-five.vercel.app/api/top-langs/?username=lokhnadhgembali&layout=compact&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=8B5CF6&text_color=C9D1D9", "./profile/top-langs.svg")
          s = s.replace("https://streak-stats.demolab.com?user=lokhnadhgembali&theme=tokyonight&hide_border=true&background=0D1117&ring=8B5CF6&fire=7C3AED&currStreakLabel=8B5CF6", "./profile/streak.svg")
          p.write_text(s)
          PY

      - name: Commit cards and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update GitHub analytics cards [skip ci]"
          git push
